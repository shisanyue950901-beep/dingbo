name: build-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Fetch ffmpeg (LGPL)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item (Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg/ffmpeg.exe
      - name: Smoke test
        run: python -c "import streamget, webview, dingbo.core; print('ok')"
      - name: Build
        run: pyinstaller dingbo.spec --noconfirm
      - name: Selftest exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Dingbo/盯播.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Pack
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          Copy-Item README.md, NOTICE.md, LICENSE dist/Dingbo/
          Compress-Archive dist/Dingbo/* "Dingbo-$v-win64.zip"
          echo "ZIP=Dingbo-$v-win64.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: dingbo-win64
          path: ${{ env.ZIP }}
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          name: 盯播 ${{ github.ref_name }}
          body_path: CHANGELOG.md
